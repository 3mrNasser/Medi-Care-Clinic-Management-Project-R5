# CI/CD for MediCare.
# - Every pull request and every push to main: restore, build (Release) and run all tests.
# - Push to main: also publish and deploy to Azure App Service, but ONLY after the Azure setup exists:
#     Settings → Secrets and variables → Actions
#       Variables: AZURE_WEBAPP_NAME              (the App Service name)
#       Secrets:   AZURE_WEBAPP_PUBLISH_PROFILE   (Azure portal → App Service → Download publish profile)
#   Until then the deploy job is skipped, so CI stays green.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MediCare.slnx

      - name: Build
        run: dotnet build MediCare.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MediCare.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  deploy:
    name: Deploy to Azure App Service
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish MediCare.Web/MediCare.Web.csproj --configuration Release --output publish

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
